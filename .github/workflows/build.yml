name: Build Flutter Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError'"

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Verificar Estrutura de Diretórios
        run: |
          echo "=== Diretório Atual ==="
          pwd
          echo "=== Conteúdo da Raiz ==="
          ls -la

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Desativar Telemetria e Aceitar Licenças
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: Instalar Dependências e Compilar
        run: |
          # Procura a pasta que contém o pubspec.yaml
          PROJECT_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
          echo "Projeto Flutter encontrado em: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Localizar APK e Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: "**/build/app/outputs/flutter-apk/app-release.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
